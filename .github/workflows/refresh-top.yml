name: Refresh top package lists

on:
  schedule:
    - cron: '0 6 1 * *' # monthly
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/refresh-top.mjs
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/refresh-top-lists
          title: 'chore: refresh bundled top package lists'
          commit-message: 'chore: refresh bundled top package lists'
          body: Monthly refresh of data/top-npm.json and data/top-pypi.json via `npm run refresh-top`.
